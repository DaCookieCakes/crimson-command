# LOADOUT GROUPS #
- type: loadoutGroup
  id: LoadoutGroupDetectiveHeadwear
  name: loadout-group-det-headwear
  minLimit: 0
  loadouts:
  - LoadoutDetectiveFedoraBrown
  - LoadoutDetectiveFedoraGrey
  - LoadoutDetectiveGoGoHat

- type: loadoutGroup
  id: LoadoutGroupDetectiveNeckwear
  name: loadout-group-det-neckwear
  passengerFallbackGroup: LoadoutGroupPassengerNeckwear
  minLimit: 0
  loadouts:
  - LoadoutDetectiveNecktie
  - LoadoutBlackScarf
  - LoadoutBrownScarf

- type: loadoutGroup
  id: LoadoutGroupDetectiveJumpers
  name: loadout-group-det-jumpers
  loadouts:
  - LoadoutDetectiveHardwornSuit
  - LoadoutDetectiveHardwornSuitskirt
  - LoadoutDetectiveNoirSuit
  - LoadoutDetectiveNoirSuitskirt

- type: loadoutGroup
  id: LoadoutGroupDetectiveOuterwear
  name: loadout-group-det-outerwear
  passengerFallbackGroup: LoadoutGroupPassengerOuterwear
  minLimit: 0
  defaultSelected: 1
  loadouts:
  - LoadoutDetectiveVest
  - LoadoutDetectiveArmoredTrenchcoat
  - LoadoutNoirArmoredTrenchcoat
  - LoadoutDetectiveTrenchcoat
  - LoadoutNoirTrenchcoat

- type: loadoutGroup
  id: LoadoutGroupDetectiveHandwear
  name: loadout-group-det-handwear
  minLimit: 0
  defaultSelected: 1
  loadouts:
  - LoadoutDetectiveForensicGloves
  - LoadoutBlackGloves

- type: loadoutGroup
  id: LoadoutGroupDetectiveWeapons
  name: loadout-group-det-weapons
  minLimit: 0
  maxLimit: 2
  loadouts:
  - LoadoutWeaponStunBaton
  - LoadoutWeaponFlash
  - LoadoutDisabler
  - LoadoutSecurityPistolInspector

- type: loadoutGroup
  id: LoadoutGroupDetectiveFootwear
  name: loadout-group-det-footwear
  passengerFallbackGroup: LoadoutGroupPassengerFootwear
  minLimit: 0 # This is probably a bad idea, job-wise... but we remain silly :3
  defaultSelected: 1
  loadouts:
  - LoadoutLaceupShoes
  - LoadoutBlackWinterBoots
  - LoadoutBrownWinterBoots
  - LoadoutSecurityCombatBoots
  - LoadoutSecurityJackBoots
  - LoadoutSecurityWinterBoots

- type: loadoutGroup
  id: LoadoutGroupDetectiveTrinkets
  name: loadout-group-jobtrinkets
  minLimit: 0
  maxLimit: 2
  loadouts:
  - SecStar
  - LoadoutDetectiveLizardPlushie
