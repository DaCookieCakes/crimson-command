- type: entity
  parent: VendingMachine
  id: EntVendingMachineUnlockedChefvend
  name: ChefVend
  description: An ingredient vendor for all your cheffin needs.
  suffix: Unlocked, CrimsonCommand
  components:
  - type: VendingMachine
    pack: ChefvendInventory
    offState: off
    brokenState: broken
    normalState: normal-unshaded
    ejectState: eject-unshaded
  - type: DatasetVocalizer
    dataset: ChefvendAds
  - type: SpeakOnUIClosed
    pack: ChefvendGoodbyes
  - type: Sprite
    sprite: Structures/Machines/VendingMachines/chefvend.rsi
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: PointLight
    radius: 1.5
    energy: 3.0
    color: "#4b93ad"
